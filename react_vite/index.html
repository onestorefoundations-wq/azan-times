<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <title>Mosque TV Display</title>
    <script>
      /*
       * Blank-screen reporter.
       *
       * A TV box has no console and no devtools. When its WebView cannot parse
       * the bundle the page simply stays empty, which tells a mosque admin
       * nothing and tells us nothing either. This is a classic (non-module)
       * script, so it runs even on a WebView far too old for the app itself,
       * and it turns any such failure into a readable panel on the screen.
       */
      (function () {
        var failures = [];

        function report(message) {
          failures.push(message);
          render();
        }

        function render() {
          var root = document.getElementById('boot-error');
          if (!root) return;
          root.style.display = 'block';
          root.innerHTML =
            '<div style="font:14px/1.5 monospace;color:#fff;padding:20px">' +
            '<div style="font-size:18px;font-weight:bold;margin-bottom:10px">Display failed to start</div>' +
            '<div style="opacity:.75;margin-bottom:12px">Show this screen to your installer.</div>' +
            '<div style="opacity:.9;word-break:break-word">' +
            failures.map(function (f) { return '• ' + f; }).join('<br>') +
            '</div>' +
            '<div style="margin-top:14px;opacity:.6;word-break:break-word">UA: ' +
            navigator.userAgent +
            '</div></div>';
        }

        window.addEventListener('error', function (e) {
          // Covers module parse/syntax errors, which is the failure mode an old
          // WebView actually hits.
          report(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : ''));
        });

        window.addEventListener('unhandledrejection', function (e) {
          report('Unhandled promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });

        // Nothing may throw at all -- an unsupported bundle can be skipped
        // silently. If React has not mounted by now, say so rather than
        // leaving a black screen.
        setTimeout(function () {
          var app = document.getElementById('root');
          if (app && app.children.length === 0) {
            report('App did not start within 12 seconds (no content rendered).');
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error" style="display:none;position:fixed;inset:0;background:#0F172A;z-index:99999;overflow:auto"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
